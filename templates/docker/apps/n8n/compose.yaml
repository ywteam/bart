# https://docs.n8n.io/hosting/installation/server-setups/docker-compose
# https://github.com/n8n-io/n8n-hosting/blob/main/docker-compose/withPostgresAndWorker/docker-compose.yml
# https://github.com/n8n-io/self-hosted-ai-starter-kit/blob/main/docker-compose.yml
# https://hub.docker.com/r/n8nio/n8n/tags?page=1&ordering=last_updated
x-n8n-svc: &n8n-svc
  extends:
    file: ../compose.yaml
    service: yellow-manager-svc
  networks:
    - n8n

services:
  n8n:
    <<: *n8n-svc
    image: docker.n8n.io/n8nio/n8n:${SVC_N8N_VERSION:-1.82.1}
    hostname: n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${SVC_N8N_DB_HOST:-n8n-db}
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${SVC_N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${SVC_N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${SVC_N8N_DB_PASSWORD:-n8n}
      EXECUTIONS_MODE: ${SVC_N8N_EXECUTIONS_MODE:-queue}
      QUEUE_BULL_REDIS_HOST: ${SVC_N8N_REDIS_HOST:-n8n-redis}
      QUEUE_HEALTH_CHECK_ACTIVE: true
      N8N_HOST: n8n.yellowteam.xyz
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8n.yellowteam.xyz/
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n-data:/home/node/.n8n
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.n8n.rule=Host(`n8n.yellowteam.xyz`)"
        # - "traefik.http.routers.whoami.tls=true"
        - "traefik.http.routers.n8n.entrypoints=web" # ,websecure
        # - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
        - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
      placement:
        constraints:
          - node.role == manager
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.yellowteam.xyz`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=yellowteam.xyz
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
  n8n-redis:
    extends:
      file: ../redis/compose.yaml
      service: redis
    <<: *n8n-svc
    hostname: n8n-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-n8n}
    volumes:
      - n8n-redis-data:/data
  n8n-db:
    extends:
      file: ../postgres/compose.yaml
      service: postgres
    <<: *n8n-svc
    hostname: n8n-db
    environment:
      POSTGRES_DB: ${SVC_N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${SVC_N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${SVC_N8N_DB_PASSWORD:-n8n}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

networks:
  n8n:
    name: yellow-n8n
    driver: overlay
    external: false    

volumes:
  n8n-postgres-data:
    name: n8n-db-data
    driver: local
  n8n-redis-data:
    name: n8n-redis-data
    driver: local
  n8n-data:
    name: n8n-data
    driver: local

