http:
  middlewares:
# https://github.com/goauthentik/authentik/issues/2366
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        # cause: http 500
        # address: https://authentik.yellowteam.xyz/outpost.goauthentik.io/auth/traefik                
        # cause: no app for hostname. Check the outpost settings and make sure 'svc.domain.tld' is included.
        # address: http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version