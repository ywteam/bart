          cpus: 1
          memory: "524288000"
        reservations:
          cpus: 0.5
          memory: "1073741824"
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 5
        window: 4m0s
    environment:
      APP_GROUP_ID: "1000"
      APP_USER_ID: "1000"
      APP_VERSION: 0.0.1-alpha-0
      STACK_DOMAIN: yellowteam.xyz
      STACK_ENV: dev
      STACK_NAME: yellowteam
      STACK_VERSION: 0.0.1-alpha-0
