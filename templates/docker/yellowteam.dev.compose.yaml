    labels:
      app-version: 0.0.1-alpha-0
      node-hostname: '{{.Node.Hostname}}'
      node-id: '{{.Node.ID}}'
      traefik.enable: "true"
      traefik.http.routers.whoami.entrypoints: websecure
      traefik.http.routers.whoami.middlewares: authentik@file
      traefik.http.routers.whoami.rule: Host(`whoami.yellowteam.xyz`) && PathPrefix(`/me`)
      traefik.http.routers.whoami.tls: "true"
      traefik.http.routers.whoami.tls.certresolver: staging
      traefik.http.services.whoami.loadbalancer.server.port: "80"
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 5m
    networks:
      stack: null
    volumes:
      - type: volume
        source: stack-tmp
        target: /tmp
        volume: {}
      - type: volume
        source: stack-logs
        target: /var/log/yellow
        volume: {}
      - type: volume
        source: stack-data
        target: /var/lib/yellow
        volume: {}
      - type: volume
        source: stack-tmpfs
        target: /tmpfs
        volume: {}
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: true
networks:
  stack:
    name: yellowteam-dev-network
    driver: overlay
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 10.1.0.0/24
          gateway: 10.1.0.1
          ip_range: 10.1.0.0/24
          aux_addresses:
            pihole: 10.1.0.3
            safeline: 10.1.0.2
    attachable: true
    enable_ipv4: true
    enable_ipv6: false
  stack-edge:
    name: yellowteam-dev-edge
    driver: overlay
    attachable: true
    enable_ipv4: true
    enable_ipv6: false
volumes:
  authentik-certs:
    name: yellowteam-dev-authentik-certs
    driver: local
  authentik-database:
    name: yellowteam-dev-authentik-postgresql
    driver: local
  authentik-redis:
    name: yellowteam-dev-authentik-redis
    driver: local
    driver_opts:
      device: tmpfs
      type: tmpfs
  stack-data:
    name: yellowteam-dev-data
    driver: local
    driver_opts:
      device: tmpfs
      type: tmpfs
  stack-logs:
    name: yellowteam-dev-logs
    driver: local
    driver_opts:
      device: /var/log/yellowteam
      o: bind
      type: none
  stack-tmp:
    name: yellowteam-dev-tmp
    driver: local
    driver_opts:
      device: /tmp/yellowteam
      o: bind
      type: none
  stack-tmpfs:
    name: yellowteam-dev-tmpfs
    driver: local
    driver_opts:
      device: tmpfs
      type: tmpfs
  traefik-acme:
    name: yellowteam-dev-traefik-acme
    driver: local
