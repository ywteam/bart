name: yellowteam
services:
  authentik-postgresql:
    container_name: authentik-postgresql
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 1m0s
        order: stop-first
      resources:
        limits:
          cpus: 1
          memory: "524288000"
        reservations:
          cpus: 0.5
          memory: "1073741824"
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 5
        window: 4m0s
    environment:
      APP_GROUP_ID: "1000"
      APP_USER_ID: "1000"
      APP_VERSION: 0.0.1-alpha-0
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: gctcMhCJHAsO4SlxVix+jPUHkvX90I8rVQNait93zkLEg4sn
      POSTGRES_USER: authentik
      STACK_DOMAIN: yellowteam.xyz
      STACK_ENV: dev
      STACK_NAME: yellowteam
      STACK_VERSION: 0.0.1-alpha-0
      TZ: UTC
    extra_hosts:
      - dns.yellowteam.dev.local=10.1.0.3
      - host.docker.internal=host-gateway
      - waf.yellowteam.dev.local=10.1.0.2
    hostname: '{{.Node.Hostname}}.yellowteam.dev.local'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
      interval: 30s
      retries: 5
      start_period: 20s
    image: docker.io/library/postgres:17.4-alpine
    labels:
      app-version: 0.0.1-alpha-0
      node-hostname: '{{.Node.Hostname}}'
      node-id: '{{.Node.ID}}'
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 5m
    networks:
      stack: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: stack-tmp
        target: /tmp
        volume: {}
      - type: volume
        source: stack-logs
        target: /var/log/yellow
        volume: {}
      - type: volume
        source: stack-data
        target: /var/lib/yellow
        volume: {}
      - type: volume
        source: stack-tmpfs
        target: /tmpfs
        volume: {}
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: authentik-database
        target: /var/lib/postgresql/data
        volume: {}
  authentik-proxy:
    container_name: authentik-proxy
    depends_on:
      authentik-server:
        condition: service_healthy
        required: true
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 1m0s
        order: stop-first
      resources:
        limits:
          cpus: 1
          memory: "524288000"
        reservations:
          cpus: 0.5
          memory: "1073741824"
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 5
        window: 4m0s
    environment:
      APP_GROUP_ID: "1000"
      APP_USER_ID: "1000"
      APP_VERSION: 0.0.1-alpha-0
      AUTHENTIK_DEBUG: "true"
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_HOST_BROWSER: https://authentik.yellowteam.xyz
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_PORT: "9000"
      AUTHENTIK_TOKEN: 0TipH+mrxqOoVzCBRwmMBX45ItzdPEaknXdENjWfFOgkxJG1zSonY+qK2jf0GaC3sU/ZHB6PWqigPOT+
      STACK_DOMAIN: yellowteam.xyz
      STACK_ENV: dev
      STACK_NAME: yellowteam
      STACK_VERSION: 0.0.1-alpha-0
      TZ: UTC
    extra_hosts:
      - dns.yellowteam.dev.local=10.1.0.3
      - host.docker.internal=host-gateway
      - waf.yellowteam.dev.local=10.1.0.2
    hostname: '{{.Node.Hostname}}.yellowteam.dev.local'
    image: ghcr.io/goauthentik/proxy:2025.2.1
    labels:
      app-version: 0.0.1-alpha-0
      node-hostname: '{{.Node.Hostname}}'
      node-id: '{{.Node.ID}}'
      traefik.enable: "true"
      traefik.http.routers.authentik-output.entrypoints: websecure
      traefik.http.routers.authentik-output.middlewares: authentik@file
      traefik.http.routers.authentik-output.rule: HostRegexp(`{subdomain:[a-z0-9-]+}.yellowteam.xyz`) && PathPrefix(`/outpost.goauthentik.io/auth/traefik`)
      traefik.http.routers.authentik-output.tls: "true"
      traefik.http.routers.authentik-output.tls.certresolver: staging
      traefik.http.services.authentik-output.loadbalancer.server.port: "9000"
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 5m
    networks:
      stack: null
      stack-edge: null
    ports:
      - mode: ingress
        target: 9000
        published: "9000"
        protocol: tcp
      - mode: ingress
        target: 9443
        published: "9443"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: stack-tmp
        target: /tmp
        volume: {}
      - type: volume
        source: stack-logs
        target: /var/log/yellow
        volume: {}
      - type: volume
        source: stack-data
        target: /var/lib/yellow
        volume: {}
      - type: volume
        source: stack-tmpfs
        target: /tmpfs
        volume: {}
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: true
  authentik-redis:
    command:
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    container_name: authentik-redis
    deploy:
