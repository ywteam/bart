    hostname: '{{.Node.Hostname}}.yellowteam.dev.local'
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      timeout: 3s
      interval: 30s
      retries: 5
      start_period: 20s
    image: docker.io/library/redis:7.4.2-alpine
    labels:
      app-version: 0.0.1-alpha-0
      node-hostname: '{{.Node.Hostname}}'
      node-id: '{{.Node.ID}}'
    logging:
      driver: json-file
